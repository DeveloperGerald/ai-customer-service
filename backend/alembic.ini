[alembic]
script_location = alembic
prepend_sys_path = .
# 默认占位：真实环境通过 env.py 的 load_settings() 读取 DB__URL 环境变量覆盖；
# 这里留一个「合法但不可用」的 postgresql+psycopg URL，防止 load_settings() 失败时回退到非法的 driver:// 占位符，
# 导致出现 NoSuchModuleError: Can't load plugin: sqlalchemy.dialects:driver。
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@127.0.0.1:5432/placeholder_must_set_env

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
